<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>社區設施預約系統</title>
<link rel="stylesheet" href="css/style.css">
</head>
<body>
<header class="topbar">
  <h1>🏘️ 社區設施預約系統</h1>
  <a href="/admin" style="color:#fff; font-size:.85rem; opacity:.85;">物業後台</a>
</header>

<nav class="tabs">
  <button id="tabBook" class="active">預約場地</button>
  <button id="tabLookup">查詢／取消</button>
</nav>

<main>
  <section id="viewBook">
    <div id="facilityGrid" class="grid"></div>
    <div id="bookingPanel" class="hidden"></div>
  </section>

  <section id="viewLookup" class="hidden">
    <div class="card">
      <h3>查詢／取消預約</h3>
      <div class="row">
        <div>
          <label>查詢碼</label>
          <input type="text" id="lookupCode" placeholder="8 碼查詢碼">
        </div>
        <div>
          <label>門牌號碼</label>
          <input type="text" id="lookupHouse" placeholder="預約時填寫的門牌號碼">
        </div>
      </div>
      <button class="btn" id="lookupBtn">查詢</button>
      <div id="lookupResult"></div>
    </div>
  </section>

  <p class="footer-note">送出預約後請務必保存查詢碼，遺失查詢碼需請物業協助查詢。</p>
</main>

<script type="module" src="js/app.js"></script>
</body>
</html>

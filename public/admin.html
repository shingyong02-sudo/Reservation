<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<meta name="theme-color" content="#1c1814">
<title>物業管理後台 · 聯懋超綻</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="preconnect" href="https://www.gstatic.com" crossorigin>
<link rel="preconnect" href="https://firestore.googleapis.com" crossorigin>
<link rel="preconnect" href="https://identitytoolkit.googleapis.com" crossorigin>
<link rel="modulepreload" href="js/admin.js?v=20260807e">
<link rel="modulepreload" href="js/firebase-config.js?v=20260807e">
<link rel="modulepreload" href="js/shared.js?v=20260807e">
<link rel="stylesheet" href="css/style.css?v=20260807e">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><rect width='32' height='32' rx='3' fill='%231c1814'/><text x='16' y='24' font-size='22' text-anchor='middle' fill='%23c8a04a' font-family='serif'>管</text></svg>">
</head>
<body>

<!-- 登入 -->
<section id="loginView">
  <div style="max-width:400px;margin:0 auto;padding:64px 20px">
    <div style="display:flex;align-items:center;gap:14px;justify-content:center;margin-bottom:28px">
      <span class="seal" aria-hidden="true"><span>聯</span><span>懋</span><span>超</span><span>綻</span></span>
      <span>
        <span class="brand-name">聯懋超綻</span>
        <span class="brand-sub">物業管理後台</span>
      </span>
    </div>
    <div class="card ruled">
      <h3>物業登入</h3>
      <div class="field">
        <label for="loginEmail">Email</label>
        <input type="email" id="loginEmail" autocomplete="username" inputmode="email">
      </div>
      <div class="field">
        <label for="loginPassword">密碼</label>
        <input type="password" id="loginPassword" autocomplete="current-password">
      </div>
      <div id="loginAlert" role="alert" aria-live="assertive"></div>
      <button type="button" class="btn primary block" id="loginBtn">登入</button>
      <p class="hint">帳號由社區管理者在 Firebase Console 建立。</p>
      <p class="hint"><a href="#" id="forgotPwdLink">忘記密碼？</a></p>
    </div>
  </div>
</section>

<!-- 後台主體 -->
<div id="appView" class="admin-shell hidden">
  <aside class="admin-aside">
    <div class="brand">
      <span class="seal sm" aria-hidden="true"><span>聯</span><span>懋</span><span>超</span><span>綻</span></span>
      <span>
        <span class="brand-name">聯懋超綻</span>
        <span class="brand-sub">物業管理後台</span>
      </span>
    </div>
    <nav class="admin-nav" aria-label="後台功能">
      <button type="button" id="tab-dashboard" class="active">今日總覽</button>
      <button type="button" id="tab-bookings">預約管理</button>
      <button type="button" id="tab-facilities">場地與時段設定</button>
      <button type="button" id="tab-equipment">設備管理</button>
      <button type="button" id="tab-notices">公告管理</button>
      <button type="button" id="tab-accounts">帳號管理</button>
      <button type="button" id="tab-logs">操作紀錄</button>
    </nav>
    <div class="admin-foot">
      <span id="currentUserLabel"></span><br>
      <span id="currentRoleLabel" class="role-tag"></span><br>
      <button type="button" id="logoutBtn" style="background:none;border:0;color:var(--ink-300);padding:6px 0;cursor:pointer;font-family:inherit;font-size:inherit;text-decoration:underline">登出</button>
    </div>
  </aside>

  <main class="admin-main">
    <div id="view-dashboard"></div>
    <div id="view-bookings" class="hidden"></div>
    <div id="view-facilities" class="hidden"></div>
    <div id="view-equipment" class="hidden"></div>
    <div id="view-notices" class="hidden"></div>
    <div id="view-accounts" class="hidden"></div>
    <div id="view-logs" class="hidden"></div>
  </main>
</div>

<script type="module" src="js/admin.js?v=20260807e"></script>
</body>
</html>
